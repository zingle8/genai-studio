server:
  port: 38100

spring:
  application:
    name: jv-genai-router
  datasource:
    # 复用模型注册库（同实例跨库读写：models/apikey/billing/logs/costs）
    url: jdbc:mysql://localhost:3306/genai_models?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: Root@123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    # Redis（Docker redis:7.2）：限流计数优先存取；不可用时降级 MySQL 双记录
    redis:
      host: localhost
      port: 6379
      password: Redis@123456
      timeout: 2000

mybatis:
  configuration:
    map-underscore-to-camel-case: true

# 网关平台接入（jv-api-gateway-client-starter：服务注册/心跳/调用采集上报）
zimo:
  gateway:
    client:
      enabled: true
      # 统一入口：jv-api-gateway-proxy（按前缀转发 /discovery /trace 等）
      server-addr: http://127.0.0.1:28090/api
      client-token: ${GATEWAY_CLIENT_TOKEN:dev-gateway-token}
      app-id: app-genai-studio
      app-name: GenAI Studio
      service-id: jv-genai-router
      service-name: 模型路由转发服务
      ip: 127.0.0.1
      port: 38100
      registry:
        enabled: true
        heartbeat-interval: 30000
