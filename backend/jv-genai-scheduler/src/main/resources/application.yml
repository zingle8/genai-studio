server:
  port: 38098

spring:
  application:
    name: jv-genai-scheduler
  datasource:
    url: jdbc:mysql://localhost:3306/genai_scheduler?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: Root@123456
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  configuration:
    map-underscore-to-camel-case: true

# 定时任务线程池
scheduler:
  pool-size: 4

# 网关平台接入（jv-api-gateway-client-starter：服务注册/心跳/调用采集上报）
zimo:
  gateway:
    client:
      enabled: true
      # 统一入口：jv-api-gateway-proxy（按前缀转发 /discovery /trace 等）
      server-addr: http://127.0.0.1:28090/api
      client-token: ${GATEWAY_CLIENT_TOKEN:dev-gateway-token}
      app-id: app-genai-studio
      app-name: GenAI Studio
      service-id: jv-genai-scheduler
      service-name: 定时任务调度服务
      ip: 127.0.0.1
      port: 38098
      registry:
        enabled: true
        heartbeat-interval: 30000
